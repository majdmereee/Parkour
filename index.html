<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نيون هوكي - مستطيل ديناميكي 🏑</title>
    <style>
        :root { --bg-color: #050508; --panel-bg: #111118; --text-color: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        
        /* واجهات المستخدم */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
        .panel { background: rgba(17, 17, 24, 0.9); padding: 30px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.8); text-align: center; width: 90%; max-width: 400px; pointer-events: auto; backdrop-filter: blur(5px); }
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; margin-bottom: 20px; font-size: 2em; }
        
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #444; background: #000; color: #fff; border-radius: 8px; text-align: center; outline: none; font-size: 1.1em; }
        input:focus { border-color: #00ffcc; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.2em; cursor: pointer; transition: 0.2s; background: #00ffcc; color: #000; margin-top: 10px; }
        button:active { transform: scale(0.95); }
        .btn-start { background: #ffcc00; display: none; }

        .score-board { position: absolute; top: 10px; left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 5; pointer-events: none; flex-wrap: wrap; }
        .score-item { font-size: 1.2em; font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; }

        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* عصا التحكم (Joystick) */
        #joyBase { position: absolute; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 20; display: none; pointer-events: none; transform: translate(-50%, -50%); }
        #joyStick { position: absolute; width: 40px; height: 40px; background: rgba(0, 255, 204, 0.6); border-radius: 50%; top: 30px; left: 30px; box-shadow: 0 0 15px #00ffcc; pointer-events: none; }
    </style>
</head>
<body>

    <div class="score-board" id="scoreBoard"></div>

    <div class="overlay" id="uiOverlay">
        <div class="panel" id="loginPanel">
            <h1>طاولة بلياردو نيون 🏑</h1>
            <input type="text" id="playerName" placeholder="الاسم" required maxlength="10">
            <input type="text" id="roomCode" placeholder="رقم الغرفة" required>
            <button onclick="GameNetwork.joinRoom()">دخول الغرفة</button>
        </div>
        
        <div class="panel" id="lobbyPanel" style="display: none;">
            <h2 style="color: #ff0055;">غرفة: <span id="lblRoom"></span></h2>
            <p id="lblStatus" style="color: #aaa; margin: 10px 0;"></p>
            <div id="playersList" style="margin: 15px 0; text-align: right; background: #000; padding: 10px; border-radius: 8px;"></div>
            <button id="btnStartGame" class="btn-start" onclick="GameNetwork.startGame()">بدء اللعبة 🚀</button>
        </div>
    </div>

    <!-- عصا التحكم -->
    <div id="joyBase"><div id="joyStick"></div></div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const CONFIG = {
            SERVER: 'https://render-kr1o.onrender.com/', // السيرفر الوسيط
            COLORS: ['#00ffcc', '#ff0055', '#ffcc00', '#33ff00', '#cc00ff'],
            PUCK_R: 15, PADDLE_R: 30, SPEED: 800, MAX_PLAYERS: 5
        };

        const State = {
            me: { id: null, isHost: false },
            players: [], room: '', isPlaying: false,
            puck: { x: 0, y: 0, dx: 0, dy: 0 },
            paddles: {}, scores: {},
            boardSegments: [] // الحواف والأهداف الديناميكية
        };

        const Joy = {
            active: false, baseX: 0, baseY: 0, nx: 0, ny: 0,
            init: () => {
                const b = document.getElementById('joyBase');
                const s = document.getElementById('joyStick');
                
                window.addEventListener('touchstart', e => {
                    if (!State.isPlaying) return;
                    Joy.active = true;
                    Joy.baseX = e.touches[0].clientX; Joy.baseY = e.touches[0].clientY;
                    b.style.display = 'block';
                    b.style.left = Joy.baseX + 'px'; b.style.top = Joy.baseY + 'px';
                    s.style.transform = `translate(0px, 0px)`;
                });
                
                window.addEventListener('touchmove', e => {
                    if (!Joy.active) return;
                    let dx = e.touches[0].clientX - Joy.baseX;
                    let dy = e.touches[0].clientY - Joy.baseY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 30;
                    
                    if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
                    s.style.transform = `translate(${dx}px, ${dy}px)`;
                    Joy.nx = dx / maxDist; Joy.ny = dy / maxDist; // Vector (-1 to 1)
                });

                const endJoy = () => { Joy.active = false; b.style.display = 'none'; Joy.nx = 0; Joy.ny = 0; };
                window.addEventListener('touchend', endJoy);
                window.addEventListener('touchcancel', endJoy);
            }
        };

        const Geom = {
            // حساب حدود الطاولة بناءً على عدد اللاعبين الأحياء
            buildTable: () => {
                const W = window.innerWidth * 0.9;
                const H = window.innerHeight * 0.9;
                const offsetX = (window.innerWidth - W) / 2;
                const offsetY = (window.innerHeight - H) / 2;
                
                let alive = State.players.filter(p => State.scores[p.id] > 0);
                if (alive.length === 0) return;
                
                let N = alive.length;
                let perimeter = 2 * W + 2 * H;
                let slice = perimeter / N;
                
                State.boardSegments = [];
                
                const getCoord = (d) => {
                    d = d % perimeter;
                    if (d < d || d < W) return { x: offsetX + d, y: offsetY }; // Top
                    if (d < W + H) return { x: offsetX + W, y: offsetY + (d - W) }; // Right
                    if (d < 2*W + H) return { x: offsetX + W - (d - W - H), y: offsetY + H }; // Bottom
                    return { x: offsetX, y: offsetY + H - (d - 2*W - H) }; // Left
                };

                for (let i = 0; i < N; i++) {
                    let startD = i * slice;
                    let endD = (i + 1) * slice;
                    let midD = startD + slice / 2;
                    let goalLen = slice * 0.35; // 35% من حصته هي المرمى
                    
                    State.boardSegments.push({
                        player: alive[i],
                        wall1: [getCoord(startD), getCoord(midD - goalLen/2)],
                        goal:  [getCoord(midD - goalLen/2), getCoord(midD + goalLen/2)],
                        wall2: [getCoord(midD + goalLen/2), getCoord(endD)]
                    });
                }
            },
            
            lineCircleCollide: (c, r, p1, p2) => {
                let dx = p2.x - p1.x, dy = p2.y - p1.y;
                let len = Math.hypot(dx, dy);
                let dot = (((c.x - p1.x)*dx) + ((c.y - p1.y)*dy)) / (len*len);
                let cx = p1.x + dot * dx, cy = p1.y + dot * dy;
                if (dot < 0 || dot > 1) return null;
                let dist = Math.hypot(c.x - cx, c.y - cy);
                return dist < r ? { nx: -dy/len, ny: dx/len, pen: r - dist } : null;
            }
        };

        const Engine = {
            ctx: null, lastTime: 0,
            
            init: () => {
                const cvs = document.getElementById('gameCanvas');
                cvs.width = window.innerWidth; cvs.height = window.innerHeight;
                Engine.ctx = cvs.getContext('2d');
                window.addEventListener('resize', () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; Geom.buildTable(); });
                Joy.init();
            },

            start: () => {
                document.getElementById('uiOverlay').style.display = 'none';
                State.isPlaying = true;
                State.puck = { x: window.innerWidth/2, y: window.innerHeight/2, dx: 300, dy: 300 };
                Geom.buildTable();
                State.players.forEach(p => { State.paddles[p.id] = { x: window.innerWidth/2, y: window.innerHeight/2 }; });
                Engine.lastTime = performance.now();
                requestAnimationFrame(Engine.loop);
            },

            loop: (now) => {
                if (!State.isPlaying) return;
                let dt = (now - Engine.lastTime) / 1000;
                Engine.lastTime = now;
                if(dt > 0.1) dt = 0.016; // منع التخطي عند تعليق المتصفح

                // تحديث حركتي بناءً على الجويستك
                let myPad = State.paddles[State.me.id];
                if (myPad && State.scores[State.me.id] > 0) {
                    myPad.x += Joy.nx * 500 * dt;
                    myPad.y += Joy.ny * 500 * dt;
                    
                    // تقييد المضرب داخل الشاشة
                    myPad.x = Math.max(CONFIG.PADDLE_R, Math.min(window.innerWidth - CONFIG.PADDLE_R, myPad.x));
                    myPad.y = Math.max(CONFIG.PADDLE_R, Math.min(window.innerHeight - CONFIG.PADDLE_R, myPad.y));
                    
                    GameNetwork.emit('sync_pad', { x: myPad.x, y: myPad.y });
                }

                if (State.me.isHost) Engine.physics(dt);

                Engine.draw();
                requestAnimationFrame(Engine.loop);
            },

            physics: (dt) => {
                let p = State.puck;
                p.x += p.dx * dt; p.y += p.dy * dt;
                
                // احتكاك بسيط
                p.dx *= 0.99; p.dy *= 0.99;

                // تصادم مع المضارب
                for (let id in State.paddles) {
                    if (State.scores[id] <= 0) continue;
                    let pad = State.paddles[id];
                    let dist = Math.hypot(p.x - pad.x, p.y - pad.y);
                    if (dist < CONFIG.PUCK_R + CONFIG.PADDLE_R) {
                        let angle = Math.atan2(p.y - pad.y, p.x - pad.x);
                        let speed = Math.max(Math.hypot(p.dx, p.dy), 400);
                        p.dx = Math.cos(angle) * speed; p.dy = Math.sin(angle) * speed;
                        p.x = pad.x + Math.cos(angle) * (CONFIG.PUCK_R + CONFIG.PADDLE_R + 1);
                        p.y = pad.y + Math.sin(angle) * (CONFIG.PUCK_R + CONFIG.PADDLE_R + 1);
                    }
                }

                // تصادم مع الجدران والأهداف
                for (let seg of State.boardSegments) {
                    // جدار 1
                    let col1 = Geom.lineCircleCollide(p, CONFIG.PUCK_R, seg.wall1[0], seg.wall1[1]);
                    if(col1) { p.dx -= 2*(p.dx*col1.nx + p.dy*col1.ny)*col1.nx; p.x += col1.nx*col1.pen; }
                    
                    // جدار 2
                    let col2 = Geom.lineCircleCollide(p, CONFIG.PUCK_R, seg.wall2[0], seg.wall2[1]);
                    if(col2) { p.dx -= 2*(p.dx*col2.nx + p.dy*col2.ny)*col2.nx; p.x += col2.nx*col2.pen; }

                    // المرمى
                    let goalCol = Geom.lineCircleCollide(p, CONFIG.PUCK_R, seg.goal[0], seg.goal[1]);
                    if (goalCol) {
                        State.scores[seg.player.id]--;
                        GameNetwork.emit('sync_score', { scores: State.scores });
                        Engine.updateUI();
                        Geom.buildTable(); // إعادة التشكيل إذا مات أحدهم
                        p.x = window.innerWidth/2; p.y = window.innerHeight/2;
                        p.dx = (Math.random()-0.5)*500; p.dy = (Math.random()-0.5)*500;
                        break;
                    }
                }

                GameNetwork.emit('sync_puck', { x: p.x, y: p.y, dx: p.dx, dy: p.dy });
            },

            draw: () => {
                let ctx = Engine.ctx;
                ctx.fillStyle = 'rgba(5, 5, 8, 0.4)';
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

                // رسم الطاولة (المستطيل المقطع)
                ctx.lineWidth = 6;
                State.boardSegments.forEach(seg => {
                    ctx.shadowBlur = 10; ctx.shadowColor = seg.player.color;
                    
                    // الجدران الصلبة
                    ctx.strokeStyle = seg.player.color;
                    ctx.beginPath(); ctx.moveTo(seg.wall1[0].x, seg.wall1[0].y); ctx.lineTo(seg.wall1[1].x, seg.wall1[1].y); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(seg.wall2[0].x, seg.wall2[0].y); ctx.lineTo(seg.wall2[1].x, seg.wall2[1].y); ctx.stroke();
                    
                    // المرمى
                    ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 10;
                    ctx.beginPath(); ctx.moveTo(seg.goal[0].x, seg.goal[0].y); ctx.lineTo(seg.goal[1].x, seg.goal[1].y); ctx.stroke();
                    ctx.lineWidth = 6;
                });
                ctx.shadowBlur = 0;

                // رسم المضارب
                for (let id in State.paddles) {
                    if (State.scores[id] <= 0) continue;
                    let p = State.players.find(x => x.id === id);
                    let pad = State.paddles[id];
                    ctx.beginPath(); ctx.arc(pad.x, pad.y, CONFIG.PADDLE_R, 0, Math.PI*2);
                    ctx.fillStyle = p.color; ctx.shadowBlur = 15; ctx.shadowColor = p.color; ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // رسم القرص
                ctx.beginPath(); ctx.arc(State.puck.x, State.puck.y, CONFIG.PUCK_R, 0, Math.PI*2);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = '#fff'; ctx.fill();
                ctx.shadowBlur = 0;
            },

            updateUI: () => {
                const b = document.getElementById('scoreBoard'); b.innerHTML = '';
                State.players.forEach(p => {
                    let d = document.createElement('div'); d.className = 'score-item';
                    let isDead = State.scores[p.id] <= 0;
                    d.style.color = isDead ? '#555' : p.color;
                    d.innerText = `${p.name}: ${isDead ? '💀' : State.scores[p.id]}`;
                    b.appendChild(d);
                });
            }
        };

        const GameNetwork = {
            socket: null,
            joinRoom: () => {
                let name = document.getElementById('playerName').value;
                let room = document.getElementById('roomCode').value;
                if(!name || !room) return;
                
                State.me.id = 'P_'+Math.floor(Math.random()*1000);
                State.room = room;
                State.players.push({ id: State.me.id, name: name, color: CONFIG.COLORS[0] });
                
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('lobbyPanel').style.display = 'block';
                document.getElementById('lblRoom').innerText = room;

                GameNetwork.socket = io(CONFIG.SERVER, { transports: ['websocket'] });
                GameNetwork.socket.on('connect', () => {
                    GameNetwork.emit('join', { id: State.me.id, name: name });
                    setTimeout(() => {
                        if(State.players.length === 1 || State.players[0].id === State.me.id) {
                            State.me.isHost = true;
                            document.getElementById('lblStatus').innerText = 'أنت المضيف 👑';
                            document.getElementById('btnStartGame').style.display = 'block';
                        }
                    }, 1000);
                });

                GameNetwork.socket.on('otherPlayerMoved', (d) => {
                    if(d.room !== State.room || d.sender === State.me.id) return;
                    
                    if(d.type === 'join') {
                        if (State.me.isHost && State.players.length < CONFIG.MAX_PLAYERS) {
                            if(!State.players.find(p=>p.id===d.id)) {
                                State.players.push({ id: d.id, name: d.name, color: CONFIG.COLORS[State.players.length] });
                                GameNetwork.emit('sync_lobby', { players: State.players });
                                GameNetwork.updateLobby();
                            }
                        }
                    } else if (d.type === 'sync_lobby') {
                        if(!State.me.isHost) { State.players = d.players; GameNetwork.updateLobby(); }
                    } else if (d.type === 'start') {
                        State.players = d.players; State.scores = d.scores; Engine.start(); Engine.updateUI();
                    } else if (d.type === 'sync_pad') {
                        if(State.paddles[d.sender]) { State.paddles[d.sender].x = d.x; State.paddles[d.sender].y = d.y; }
                    } else if (d.type === 'sync_puck' && !State.me.isHost) {
                        State.puck.x = d.x; State.puck.y = d.y; State.puck.dx = d.dx; State.puck.dy = d.dy;
                    } else if (d.type === 'sync_score') {
                        State.scores = d.scores; Engine.updateUI(); Geom.buildTable();
                    }
                });
                Engine.init();
            },
            emit: (type, data) => GameNetwork.socket.emit('playerMoved', { type, room: State.room, sender: State.me.id, ...data }),
            updateLobby: () => {
                document.getElementById('playersList').innerHTML = State.players.map(p => `<div style="color:${p.color}">${p.name}</div>`).join('');
            },
            startGame: () => {
                if(State.players.length < 2) return alert('الحد الأدنى 2 لاعبين');
                State.players.forEach(p => State.scores[p.id] = 5);
                GameNetwork.emit('start', { players: State.players, scores: State.scores });
                Engine.start(); Engine.updateUI();
            }
        };
    </script>
</body>
</html>
