<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        minimum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta name="theme-color" content="#101820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>TANK ARENA — Multiplayer</title>

<!-- =========================================================
     SOCKET.IO
========================================================= -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 35%,
            #26333c 0%,
            #151c22 45%,
            #0b1014 100%
        );
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}

/* =========================================================
   APP
========================================================= */

#app{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   CANVAS
========================================================= */

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;

    background:
        #1d252b;

    image-rendering:auto;

    will-change:
        transform;
}

/* =========================================================
   VIGNETTE
========================================================= */

#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 52%,
            rgba(0,0,0,.12) 72%,
            rgba(0,0,0,.52) 100%
        );

    z-index:3;
}

/* =========================================================
   TOP HUD
========================================================= */

#hud{
    position:absolute;
    z-index:20;

    top:
        calc(
            env(safe-area-inset-top)
            + 8px
        );

    left:10px;
    right:10px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    pointer-events:none;
}

.hudPanel{
    background:
        linear-gradient(
            180deg,
            rgba(22,29,34,.92),
            rgba(10,14,17,.88)
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 8px 22px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.05);

    border-radius:14px;

    padding:8px 10px;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

#roomTitle{
    font-size:13px;
    font-weight:900;
    letter-spacing:.8px;
}

#playerTitle{
    margin-top:3px;
    font-size:11px;
    opacity:.68;
}

#scoreBox{
    display:flex;
    gap:7px;
    align-items:center;

    font-size:12px;
    font-weight:900;
}

#aliveCount{
    color:#83ffab;
}

#timer{
    min-width:74px;
    text-align:center;

    color:#ffe98a;
    font-size:13px;
    font-weight:900;
}

/* =========================================================
   MINIMAP
========================================================= */

#miniMap{
    position:absolute;
    z-index:18;

    top:
        calc(
            env(safe-area-inset-top)
            + 76px
        );

    right:10px;

    width:112px;
    height:82px;

    border-radius:12px;

    background:
        rgba(10,14,17,.80);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 8px 18px rgba(0,0,0,.28);

    overflow:hidden;

    pointer-events:none;
}

/* =========================================================
   MOBILE CONTROL LAYER
========================================================= */

#controls{
    position:absolute;
    inset:0;
    z-index:30;
    pointer-events:none;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystickArea{
    position:absolute;

    left:
        calc(
            18px
            + env(safe-area-inset-left)
        );

    bottom:
        calc(
            18px
            + env(safe-area-inset-bottom)
        );

    width:min(170px,34vw);
    height:min(170px,34vw);

    min-width:120px;
    min-height:120px;

    pointer-events:auto;
}

#joystickBase{
    position:absolute;
    inset:0;

    margin:auto;

    width:100%;
    height:100%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08) 0 30%,
            rgba(255,255,255,.045) 31% 65%,
            rgba(255,255,255,.018) 66% 100%
        );

    border:
        2px solid rgba(255,255,255,.10);

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 10px 30px rgba(0,0,0,.25);
}

#joystickRing{
    position:absolute;
    left:50%;
    top:50%;

    width:64%;
    height:64%;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.025);
}

#joystickKnob{
    position:absolute;

    left:50%;
    top:50%;

    width:38%;
    height:38%;

    border-radius:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    background:
        linear-gradient(
            145deg,
            #687783,
            #313c44
        );

    border:
        2px solid rgba(255,255,255,.25);

    box-shadow:
        0 6px 18px rgba(0,0,0,.50),
        inset 0 1px 0 rgba(255,255,255,.22);

    will-change:transform;
}

/* =========================================================
   SHOOT BUTTON
========================================================= */

#shootArea{
    position:absolute;

    right:
        calc(
            20px
            + env(safe-area-inset-right)
        );

    bottom:
        calc(
            25px
            + env(safe-area-inset-bottom)
        );

    width:min(130px,27vw);
    height:min(130px,27vw);

    min-width:100px;
    min-height:100px;

    pointer-events:auto;
}

#shootButton{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.22),
            transparent 30%
        ),
        radial-gradient(
            circle,
            #dc4747 0%,
            #a71d25 58%,
            #6c1219 100%
        );

    border:
        3px solid rgba(255,255,255,.16);

    box-shadow:
        0 12px 30px rgba(0,0,0,.40),
        inset 0 2px 4px rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:18px;
    font-weight:1000;

    letter-spacing:.5px;

    transform:
        scale(1);

    transition:
        transform .06s ease,
        filter .06s ease;
}

#shootButton::before{
    content:"";
    position:absolute;
    width:58%;
    height:58%;
    border-radius:50%;

    border:
        2px solid rgba(255,255,255,.16);

    opacity:.9;
}

#shootButton:active{
    transform:scale(.92);
    filter:brightness(1.15);
}

/* =========================================================
   CENTER MESSAGE
========================================================= */

#centerMessage{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:40;

    min-width:230px;
    max-width:80vw;

    padding:16px 20px;

    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            rgba(16,22,27,.94),
            rgba(9,13,16,.94)
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 20px 60px rgba(0,0,0,.42);

    text-align:center;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

#centerMessage.show{
    opacity:1;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1);
}

#centerMessageTitle{
    font-size:22px;
    font-weight:1000;
}

#centerMessageText{
    margin-top:7px;
    font-size:13px;
    opacity:.70;
    line-height:1.5;
}

/* =========================================================
   JOIN SCREEN
========================================================= */

#joinScreen{
    position:absolute;
    z-index:100;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(48,66,77,.70),
            rgba(7,11,14,.96) 72%
        );
}

.joinCard{
    width:min(440px,94vw);

    padding:
        26px 20px 22px;

    border-radius:24px;

    background:
        linear-gradient(
            180deg,
            rgba(25,34,40,.97),
            rgba(12,17,21,.97)
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 30px 80px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.logo{
    text-align:center;

    font-size:
        clamp(
            28px,
            9vw,
            48px
        );

    line-height:.9;

    font-weight:1000;

    letter-spacing:-2px;

    color:#f2f5f7;

    text-shadow:
        0 6px 0 rgba(0,0,0,.30),
        0 10px 30px rgba(0,0,0,.30);
}

.logo span{
    color:#ffd429;
}

.subtitle{
    margin-top:11px;

    text-align:center;

    font-size:12px;

    color:#9ba8b0;
}

.form{
    margin-top:24px;

    display:grid;
    gap:12px;
}

.field{
    width:100%;

    height:52px;

    border-radius:14px;

    outline:none;

    border:
        1px solid rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.045);

    color:#fff;

    padding:
        0 15px;

    font-size:15px;
    font-weight:700;

    direction:rtl;
}

.field::placeholder{
    color:#77838a;
}

.field:focus{
    border-color:
        rgba(255,212,41,.45);

    background:
        rgba(255,255,255,.065);
}

#joinButton{
    width:100%;
    height:56px;

    border:0;
    border-radius:16px;

    margin-top:4px;

    color:#181400;

    font-size:17px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #ffe164,
            #f3c300
        );

    box-shadow:
        0 10px 26px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.35);
}

#joinButton:active{
    transform:scale(.985);
}

.connectionState{
    margin-top:14px;

    text-align:center;

    font-size:11px;

    color:#7f8a90;
}

.dot{
    display:inline-block;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#717b81;

    margin-left:5px;
}

.dot.online{
    background:#49dc7b;

    box-shadow:
        0 0 12px rgba(73,220,123,.55);
}

/* =========================================================
   WAITING PANEL
========================================================= */

#waitingPanel{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:90;

    width:min(360px,88vw);

    border-radius:18px;

    padding:20px;

    text-align:center;

    background:
        rgba(12,17,21,.95);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45);

    display:none;
}

#waitingPanel.show{
    display:block;
}

.spinner{
    width:35px;
    height:35px;

    border-radius:50%;

    border:
        3px solid rgba(255,255,255,.10);

    border-top-color:#ffd329;

    animation:
        spin .75s linear infinite;

    margin:
        0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#waitingTitle{
    font-size:18px;
    font-weight:1000;
}

#waitingText{
    margin-top:7px;
    font-size:12px;
    opacity:.64;
}

/* =========================================================
   PLAYER LIST
========================================================= */

#playersList{
    margin-top:15px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:7px;
}

.playerChip{
    padding:6px 9px;

    border-radius:99px;

    font-size:10px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);
}

/* =========================================================
   RESPAWN BUTTON
========================================================= */

#respawnButton{
    display:none;

    position:absolute;

    left:50%;
    bottom:
        calc(
            28px
            + env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    z-index:70;

    width:min(220px,60vw);
    height:48px;

    border:0;

    border-radius:14px;

    color:#fff;

    font-size:15px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #3c4d59,
            #253039
        );

    box-shadow:
        0 10px 24px rgba(0,0,0,.35);
}

#respawnButton.show{
    display:block;
}

/* =========================================================
   DESKTOP HINT
========================================================= */

#desktopHint{
    display:none;

    position:absolute;

    z-index:50;

    left:50%;
    top:85px;

    transform:translateX(-50%);

    padding:8px 12px;

    border-radius:99px;

    font-size:11px;

    background:
        rgba(0,0,0,.45);

    color:#c7d0d5;

    pointer-events:none;
}

@media(min-width:800px){

    #desktopHint{
        display:block;
    }

    #joystickArea{
        width:150px;
        height:150px;
    }

    #shootArea{
        width:120px;
        height:120px;
    }
}

/* =========================================================
   HIDE CONTROLS WHEN JOINING
========================================================= */

body.joining #controls,
body.joining #hud,
body.joining #miniMap,
body.joining #vignette{
    display:none;
}

</style>
</head>

<body class="joining">

<div id="app">

    <!-- =====================================================
         GAME
    ====================================================== -->

    <canvas id="gameCanvas"></canvas>

    <canvas id="miniMap"></canvas>

    <div id="vignette"></div>

    <!-- =====================================================
         HUD
    ====================================================== -->

    <div id="hud">

        <div class="hudPanel">

            <div id="roomTitle">
                ROOM: ----
            </div>

            <div id="playerTitle">
                PLAYER: ----
            </div>

        </div>

        <div
            class="hudPanel"
            id="scoreBox"
        >

            <span id="aliveCount">
                0/5
            </span>

            <span>
                •
            </span>

                05:00
            </span>

        </div>

    </div>

    <!-- =====================================================
         MOBILE CONTROLS
    ====================================================== -->

    <div id="controls">

        <div id="joystickArea">

            <div id="joystickBase"></div>
            <div id="joystickRing"></div>

            <div id="joystickKnob"></div>

        </div>

        <div id="shootArea">

            <div id="shootButton">

            </div>

        </div>

    </div>

        الحركة بالجويستك — صوّب واترك الزر للإطلاق
    </div>

    <!-- =====================================================
         CENTER MESSAGE
    ====================================================== -->

    <div id="centerMessage">

        <div id="centerMessageTitle">
            جاهز؟
        </div>

        <div id="centerMessageText">
            تبدأ الجولة عند دخول اللاعبين.
        </div>

    </div>

    <!-- =====================================================
         RESPAWN
    ====================================================== -->

    <button id="respawnButton">
        عودة للمعركة
    </button>

    <!-- =====================================================
         JOIN SCREEN
    ====================================================== -->

    <div id="joinScreen">

        <div class="joinCard">

            <div class="logo">
                TANK<span>ARENA</span>
            </div>

            <div class="subtitle">
                معركة دبابات متعددة اللاعبين — حتى 5 لاعبين
            </div>

            <div class="form">

                <input
                    id="nameInput"
                    class="field"
                    type="text"
                    maxlength="16"
                    autocomplete="off"
                    placeholder="اكتب اسمك"
                >

                <input
                    id="roomInput"
                    class="field"
                    type="text"
                    maxlength="16"
                    autocomplete="off"
                    placeholder="رقم / اسم الغرفة"
                >

                    دخول المعركة
                </button>

                <span
                    class="dot"

    ====================================================== -->

        </div>

        <div id="waitingText">

        </div>

        <div id="playersList"></div>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    SERVER_URL:
        'https://render-kr1o.onrender.com/',

    MAX_PLAYERS:
        5,

    WORLD_WIDTH:
        2400,

    WORLD_HEIGHT:
        1500,

    PLAYER_RADIUS:
        25,

    PLAYER_SPEED:
        285,

    BULLET_SPEED:
        850,

    BULLET_RADIUS:
        6,

    FIRE_COOLDOWN:
        310,

    BULLET_LIFE:
        1450,

    RESPAWN_TIME:
        2500,

    MATCH_TIME:
        300,

    NETWORK_RATE:
        45,

    SNAP_SMOOTH:
        0.30

};

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById(
        'gameCanvas'
    );

const ctx =
    canvas.getContext(
        '2d',
        {
            alpha:false,
            desynchronized:true
        }
    );

const mini =
    document.getElementById(
        'miniMap'
    );

const miniCtx =
    mini.getContext(
        '2d'
    );

/* =========================================================
   DEVICE SCALE
========================================================= */

let DPR =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

let VIEW_W = 0;
let VIEW_H = 0;

/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    VIEW_W =
        window.innerWidth;

    VIEW_H =
        window.innerHeight;

    canvas.width =
        Math.floor(
            VIEW_W * DPR
        );

    canvas.height =
        Math.floor(
            VIEW_H * DPR
        );

    canvas.style.width =
        VIEW_W + 'px';

    canvas.style.height =
        VIEW_H + 'px';

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    mini.width =
        112 * DPR;

    mini.height =
        82 * DPR;

    miniCtx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

window.addEventListener(
    'resize',
    resizeCanvas,
    {passive:true}
);

resizeCanvas();

/* =========================================================
   HELPERS
========================================================= */

const Utils = {

    clamp(
        value,
        min,
        max
    ){

        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    },

    lerp(
        a,
        b,
        t
    ){

        return a +
            (b - a) * t;

    },

    lerpAngle(
        a,
        b,
        t
    ){

        let diff =
            ((b - a + Math.PI)
            % (Math.PI * 2))
            - Math.PI;

        return a +
            diff * t;

    },

    distance(
        a,
        b
    ){

        const dx =
            a.x - b.x;

        const dy =
            a.y - b.y;

        return Math.sqrt(
            dx*dx + dy*dy
        );

    },

    uid(){

        return (
            Date.now().toString(36)
            +
            Math.random()
                .toString(36)
                .slice(2,8)
        );

    },

    formatTime(
        seconds
    ){

        seconds =
            Math.max(
                0,
                Math.floor(
                    seconds
                )
            );

        const m =
            Math.floor(
                seconds / 60
            );

        const s =
            seconds % 60;

        return (
            String(m)
                .padStart(2,'0')
            +
            ':'
            +
            String(s)
                .padStart(2,'0')
        );

    }

};

/* =========================================================
   PLAYER COLORS
========================================================= */

const COLORS = [
    '#e53935',
    '#29a9ff',
    '#43d46f',
    '#f0c62d',
    '#c56bff'
];

/* =========================================================
   STATE
========================================================= */

const State = {

    running:false,

    joined:false,

    room:'',

    myId:'',

    myName:'',

    playerIndex:0,

    players:{},

    bullets:[],

    particles:[],

    explosions:[],

    matchStarted:false,

    matchEndAt:0,

    lastFrame:0,

    accumulator:0,

    netAccumulator:0,

    camera:{
        x:0,
        y:0,
        zoom:1
    },

    mouseAim:{
        x:0,
        y:0
    },

    keyboard:{
        up:false,
        down:false,
        left:false,
        right:false
    }

};

/* =========================================================
   MAP
========================================================= */

/*
    الخريطة مبنية كشبكة متوازنة.
    الحدود + الجدران تشكل متاهة Arena مشابهة
    لتكوين الصور التي أرسلتها.
*/

const MAP = {

    width:
        CONFIG.WORLD_WIDTH,

    height:
        CONFIG.WORLD_HEIGHT,

    wallSize:
        48,

/* =========================================================
   RECTANGLE COLLISION
========================================================= */

function circleVsRect(
    cx,
    cy,
    radius,
    rect
){

    const closestX =
        Utils.clamp(
            cx,
            rect.x,
            rect.x + rect.w
        );

    const closestY =
        Utils.clamp(
            cy,
            rect.y,
            rect.y + rect.h
        );

    const dx =
        cx - closestX;

    const dy =
        cy - closestY;

    return (
        dx*dx +
        dy*dy
        <
        radius*radius
    );

}

/* =========================================================
   VALID POSITION
========================================================= */

function collidesWorld(
    x,
    y,
    radius
){

    if(
        x-radius < 0 ||
        x+radius > MAP.width ||
        y-radius < 0 ||
        y+radius > MAP.height
    ){

        return true;

    }

    for(
        const wall of MAP.walls
    ){

        if(
            circleVsRect(
                x,
                y,
                radius,
                wall
            )
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   MOVEMENT WITH SLIDING
========================================================= */

function moveCircle(
    entity,
    dx,
    dy,
    radius
){

    const nx =
        entity.x + dx;

    if(
        !collidesWorld(
            nx,
            entity.y,
            radius
        )
    ){

        entity.x = nx;

    }

    const ny =
        entity.y + dy;

    if(
        !collidesWorld(
            entity.x,
            ny,
            radius
        )
    ){

        entity.y = ny;

    }

}

/* =========================================================
   SPAWN
========================================================= */

function getSpawn(
    index,
    count
){

    /*
       1 player = central safe area.
       2-4 = corners.
       5 = corners + center.
    */

    let point;

    if(count <= 1){

        point =
            MAP.spawnPoints[4];

    }else{

        const points =
            MAP.spawnPoints.slice(
                0,
                Math.min(
                    4,
                    count
                )
            );

        point =
            points[
                index % points.length
            ];

    }

    return {
        x:point.x,
        y:point.y,
        angle:point.angle
    };

}

/* =========================================================
   PLAYER CREATION
========================================================= */

function createLocalPlayer(){

    const count =
        Math.max(
            1,
            Object.keys(
                State.players
            ).length + 1
        );

    const spawn =
        getSpawn(
            State.playerIndex,
            count
        );

    return {

        id:
            State.myId,

        name:
            State.myName,

        color:
            COLORS[
                State.playerIndex %
                COLORS.length
            ],

        x:
            spawn.x,

        y:
            spawn.y,

        targetX:
            spawn.x,

        targetY:
            spawn.y,

        angle:
            spawn.angle,

        targetAngle:
            spawn.angle,

        alive:true,

        hp:100,

        kills:0,

        deaths:0,

        lastShot:0,

        respawnAt:0,

        inputX:0,

        inputY:0,

        aimX:Math.cos(spawn.angle),

        aimY:Math.sin(spawn.angle),

        isLocal:true

    };

}

/* =========================================================
   NETWORK
========================================================= */

const NetworkController = {

    socket:null,

    connected:false,

    init(){

        try{

            this.socket =
                io(
                    CONFIG.SERVER_URL,
                    {
                        transports:[
                            'websocket',
                            'polling'
                        ],
                        reconnection:true,
                        reconnectionAttempts:Infinity,
                        reconnectionDelay:1000,
                        timeout:10000
                    }
                );

            this.socket.on(
                'connect',
                ()=>{
                    this.connected = true;

                    setConnectionStatus(
                        true,
                        'متصل بالسيرفر'
                    );

                    /*
                       إذا انضم اللاعب مسبقاً
                       نعيد إرسال الدخول.
                    */

                    if(State.joined){

                        this.send(
                            'join_room',
                            {
                                id:State.myId,
                                name:State.myName,
                                room:State.room,
                                color:
                                    COLORS[
                                        State.playerIndex %
                                        COLORS.length
                                    ]
                            }
                        );

                    }

                }
            );

            this.socket.on(
                'disconnect',
                ()=>{
                    this.connected = false;

                    setConnectionStatus(
                        false,
                        'انقطع الاتصال'
                    );
                }
            );

            this.socket.on(
                'connect_error',
                ()=>{
                    this.connected = false;

                    setConnectionStatus(
                        false,
                        'تعذر الاتصال — جاري المحاولة'
                    );
                }
            );

            /*
               الحدث الأساسي من السيرفر.
            */

            this.socket.on(
                'otherPlayerMoved',
                data=>{
                    this.processIncoming(
                        data
                    );
                }
            );

            /*
               دعم اسم آخر محتمل.
            */

            this.socket.on(
                'playerMoved',
                data=>{

                    /*
                       بعض السيرفرات تعيد
                       packet نفسه.
                    */

                    if(
                        data &&
                        data.id &&
                        data.id !== State.myId
                    ){

                        this.processIncoming(
                            data
                        );

                    }

                }
            );

            /*
               دعم snapshot.
            */

            this.socket.on(
                'roomState',
                data=>{
                    this.processRoomState(
                        data
                    );
                }
            );

            this.socket.on(
                'playersUpdate',
                data=>{
                    this.processRoomState(
                        data
                    );
                }
            );

        }catch(error){

            console.error(
                'Socket error:',
                error
            );

        }

    },

    send(
        type,
        payload={}
    ){

        if(
            !this.socket ||
            !this.socket.connected
        ){

            return;

        }

        const packet = {

            type,

            room:
                State.room,

            id:
                State.myId,

            name:
                State.myName,

            timestamp:
                Date.now(),

            ...payload

        };

        /*
           الاسم الأساسي المتوافق مع السيرفر الذي أرسلته.
        */

        this.socket.emit(
            'playerMoved',
            packet
        );

    },

    processRoomState(
        data
    ){

        if(!data) return;

        if(
            data.room &&
            data.room !== State.room
        ){

            return;

        }

        const players =
            Array.isArray(
                data
                    .players
            )
            ?
                data.players
            :
                Object.values(
                    data.players || {}
                );

        for(
            const raw of players
        ){

            if(
                !raw ||
                !raw.id ||
                raw.id === State.myId
            ){

                continue;

            }

            this.upsertRemotePlayer(
                raw
            );

        }

        updatePlayersUI();

    },

    processIncoming(
        data
    ){

        if(!data) return;

        /*
           دعم packet متداخل:
           {payload:{...}}
        */

        if(data.payload){

            data = {
                ...data,
                ...data.payload
            };

        }

        /*
           تأكد من الغرفة.
        */

        if(
            data.room &&
            String(data.room) !==
            String(State.room)
        ){

            return;

        }

        /*
           المعرّف.
        */

        const id =
            data.id ||
            data.playerId;

        switch(
            data.type
        ){

            case 'join_room':

                if(id){

                    this.upsertRemotePlayer(
                        data
                    );

                    updatePlayersUI();

                    /*
                       إرسال معلوماتنا للشخص الجديد.
                    */

                    this.send(
                        'player_info',
                        buildNetworkPlayer()
                    );

                    /*
                       بداية الجولة إذا صار في لاعبين.
                    */

                    if(
                        !State.matchStarted &&
                        Object.keys(
                            State.players
                        ).length >= 1
                    ){

                        beginMatch();

                    }

                }

                break;

            case 'player_info':

                if(
                    id &&
                    id !== State.myId
                ){

                    this.upsertRemotePlayer(
                        data
                    );

                    updatePlayersUI();

                }

                break;

            case 'state':

            case 'player_state':

            case 'move':

            case 'sync':

                if(
                    id &&
                    id !== State.myId
                ){

                    this.upsertRemotePlayer(
                        data
                    );

                }

                break;

            case 'shoot':

                if(id){

                    this.receiveShoot(
                        data
                    );

                }

                break;

            case 'bullet':

                if(id){

                    this.receiveShoot(
                        data
                    );

                }

                break;

            case 'hit':

                if(
                    data.targetId
                ){

                    applyRemoteHit(
                        data
                    );

                }

                break;

            case 'death':

                if(id){

                    const p =
                        State.players[id];

                    if(p){

                        killRemotePlayer(
                            p,
                            data
                                .killerId
                        );

                    }

                }

                break;

            case 'respawn':

                if(id){

                    this.upsertRemotePlayer(
                        data
                    );

                }

                break;

            case 'win_game':

                triggerWin(
                    data.name ||
                    'لاعب'
                );

                break;

            case 'start':

                beginMatch();

                break;

        }

    },

    upsertRemotePlayer(
        raw
    ){

        if(
            !raw ||
            !raw.id ||
            raw.id === State.myId
        ){

            return;

        }

        let p =
            State.players[
                raw.id
            ];

        if(!p){

            p = {

                id:
                    raw.id,

                name:
                    raw.name ||
                    'Player',

                color:
                    raw.color ||
                    COLORS[
                        Object.keys(
                            State.players
                        ).length %
                        COLORS.length
                    ],

                x:
                    Number(
                        raw.x
                    ) ||
                    200,

                y:
                    Number(
                        raw.y
                    ) ||
                    200,

                targetX:
                    Number(
                        raw.x
                    ) ||
                    200,

                targetY:
                    Number(
                        raw.y
                    ) ||
                    200,

                angle:
                    Number(
                        raw.angle
                    ) ||
                    0,

                targetAngle:
                    Number(
                        raw.angle
                    ) ||
                    0,

                aimX:
                    Number(
                        raw.aimX
                    ) ||
                    1,

                aimY:
                    Number(
                        raw.aimY
                    ) ||
                    0,

                alive:
                    raw.alive !== false,

                hp:
                    Number(
                        raw.hp
                    ) || 100,

                kills:
                    Number(
                        raw.kills
                    ) || 0,

                deaths:
                    Number(
                        raw.deaths
                    ) || 0,

                respawnAt:
                    Number(
                        raw.respawnAt
                    ) || 0,

                isLocal:false

            };

            State.players[
                raw.id
            ] = p;

        }

        if(
            Number.isFinite(
                Number(raw.x)
            )
        ){

            p.targetX =
                Number(
                    raw.x
                );

        }

        if(
            Number.isFinite(
                Number(raw.y)
            )
        ){

            p.targetY =
                Number(
                    raw.y
                );

        }

        if(
            Number.isFinite(
                Number(raw.angle)
            )
        ){

            p.targetAngle =
                Number(
                    raw.angle
                );

        }

        if(
            Number.isFinite(
                Number(raw.aimX)
            )
        ){

            p.aimX =
                Number(
                    raw.aimX
                );

        }

        if(
            Number.isFinite(
                Number(raw.aimY)
            )
        ){

            p.aimY =
                Number(
                    raw.aimY
                );

        }

        if(
            typeof raw.alive ===
            'boolean'
        ){

            p.alive =
                raw.alive;

        }

        if(
            Number.isFinite(
                Number(raw.hp)
            )
        ){

            p.hp =
                Number(
                    raw.hp
                );

        }

        if(
            Number.isFinite(
                Number(raw.kills)
            )
        ){

            p.kills =
                Number(
                    raw.kills
                );

        }

        if(
            Number.isFinite(
                Number(raw.deaths)
            )
        ){

            p.deaths =
                Number(
                    raw.deaths
                );

        }

        if(raw.name){

            p.name =
                String(
                    raw.name
                ).slice(
                    0,
                    16
                );

        }

    }

};

    return {

        id:
            me.id,

        name:
            me.name,

        color:
            me.color,

        x:
            me.x,

        y:

        angle:

        hp:
            me.hp,

        kills:
            me.kills,

        deaths:
            me.deaths,

        respawnAt:
            me.respawnAt

    };

}

            roomInput.focus();
        }
    }
);

    'keydown',
    e=>{
        if(e.key === 'Enter'){
            joinGame();
        }
    }
);

function sanitize(
    value,
    fallback
){

    const cleaned =
        String(
            value || ''
        )
        .trim()
        .replace(
            /[\u0000-\u001F]/g,
            ''
        )
        .slice(
            0,
            16
        );

    return (
        cleaned ||
        fallback
    );

}

function joinGame(){

    if(
        !NetworkController.connected
    ){

        setConnectionStatus(
            false,
            'انتظر اتصال السيرفر...'
        );

        return;

    }

    State.myName =
        sanitize(
            nameInput.value,
            'Tank'
        );

    State.room =
        sanitize(
            roomInput.value,
            'ARENA-1'
        );

    State.myId =
        Utils.uid();

    /*
       مؤقتاً نخلي أول لاعب index 0.
       السيرفر إذا أرسل ترتيباً مختلفاً
       يمكن تحديثه لاحقاً.
    */

    State.playerIndex =
        0;

    const me =
        createLocalPlayer();

    State.players[
        State.myId
    ] = me;

    State.joined =
        true;

    document.body.classList.remove(
        'joining'
    );

    document.getElementById(
        'joinScreen'
    ).style.display =
        'none';

    document.getElementById(
        'waitingPanel'
    ).classList.add(
        'show'
    );

    document.getElementById(
        'roomTitle'
    ).textContent =
        'ROOM: ' + State.room;

    document.getElementById(
        'playerTitle'
    ).textContent =
        'PLAYER: ' +
        State.myName;

    NetworkController.send(
        'join_room',
        buildNetworkPlayer()
    );

    /*
       بدء اللعبة مباشرة محلياً.
       إذا ظهر لاعب إضافي، يتم مزامنة وجوده.
    */

    beginMatch();

}

/* =========================================================
   BEGIN MATCH
========================================================= */

function beginMatch(){

    if(!State.joined){
        return;
    }

    if(State.matchStarted){
        return;
    }

    State.matchStarted =
        true;

    State.matchEndAt =
        performance.now()
        +
        CONFIG.MATCH_TIME * 1000;

    State.running =
        true;

    document.getElementById(
        'waitingPanel'
    ).classList.remove(
        'show'
    );

    showMessage(
        'ابدأ!',
        'دمر الخصوم وتحرك بين الجدران.'
    );

    setTimeout(
        ()=>{
            hideMessage();
        },
        1300
    );

    updatePlayersUI();

}

        setTimeout(

            duration
        );

}

/* =========================================================
   JOYSTICK
========================================================= */

const joystickArea =
    document.getElementById(
        'joystickArea'
    );

const joystickKnob =
    document.getElementById(
        'joystickKnob'
    );

let joystickPointerId =
    null;

const joystick =
    {
        x:0,
        y:0,
        active:false
    };

function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystickArea.getBoundingClientRect();

    const cx =
        rect.left +
        rect.width / 2;

    const cy =
        rect.top +
        rect.height / 2;

    let dx =
        clientX - cx;

    let dy =
        clientY - cy;

    const max =
        rect.width * .27;

    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(length > max){

        dx =
            dx /
            length *
            max;

        dy =
            dy /
            length *
            max;

    }

    joystick.x =
        Utils.clamp(
            dx / max,
            -1,
            1
        );

    joystick.y =
        Utils.clamp(
            dy / max,
            -1,
            1
        );

    joystickKnob.style.transform =
        `
        translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )
        `;

}

function resetJoystick(){

    joystickPointerId =
        null;

    joystick.active =
        false;

    joystick.x =
        0;

    joystick.y =
        0;

    joystickKnob.style.transform =
        'translate(-50%,-50%)';

}

joystickArea.addEventListener(
    'pointerdown',
    e=>{

        joystickPointerId =
            e.pointerId;

        joystick.active =
            true;

        joystickArea.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);

joystickArea.addEventListener(
    'pointermove',
    e=>{

        if(
            e.pointerId !==
            joystickPointerId
        ){

            return;

        }

        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);

joystickArea.addEventListener(
    'pointerup',
    resetJoystick
);

joystickArea.addEventListener(
    'pointercancel',
    resetJoystick
);

/* =========================================================
   AIM
========================================================= */

function updateAim(){

    const me =
        State.players[
            State.myId
        ];

    if(!me){
        return;
    }

    /*
       للموبايل:
       اتجاه القذيفة = اتجاه الدبابة.
       هذا يجعل التحكم واضحاً جداً
       بدون عصا ثانية.
    */

    if(
        Math.abs(
            joystick.x
        ) >
        .18
        ||
        Math.abs(
            joystick.y
        ) >
        .18
    ){

        const len =
            Math.sqrt(
                joystick.x *
                joystick.x +
                joystick.y *
                joystick.y
            );

        if(len > .001){

            me.angle =
                Math.atan2(
                    joystick.y,
                    joystick.x
                );

            me.aimX =
                Math.cos(
                    me.angle
                );

            me.aimY =
                Math.sin(
                    me.angle
                );

        }

    }

}

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

    if(!State.running){
        return;
    }

    const me =
        State.players[
            State.myId
        ];

    if(
        !me ||
        !me.alive
    ){

        return;

    }

    const now =
        performance.now();

    if(
        now - me.lastShot <
        CONFIG.FIRE_COOLDOWN
    ){

        return;

    }

    updateAim();

    me.lastShot =
        now;

    const muzzleDistance =
        42;

    const bx =
        me.x +
        me.aimX *
        muzzleDistance;

    const by =
        me.y +
        me.aimY *
        muzzleDistance;

    /*
       إذا فوهة السلاح خلف حائط
       لا نطلق.
    */

    if(
        collidesWorld(
            bx,
            by,
            5
        )
    ){

        createMuzzleFlash(
            me.x +
            me.aimX *
            31,

            me.y +
            me.aimY *
            31
        );

        return;

    }

    const bullet = {

        id:
            Utils.uid(),

        owner:
            me.id,

        x:
            bx,

        y:
            by,

        vx:
            me.aimX *
            CONFIG.BULLET_SPEED,

        vy:
            me.aimY *
            CONFIG.BULLET_SPEED,

        life:
            CONFIG.BULLET_LIFE,

        color:
            me.color,

        dead:false

    };

    State.bullets.push(
        bullet
    );

    createMuzzleFlash(
        bx,
        by
    );

    NetworkController.send(
        'shoot',
        {

            x:
                bullet.x,

            y:
                bullet.y,

            vx:
                bullet.vx,

            vy:
                bullet.vy,

            bulletId:
                bullet.id

        }
    );

}

/* =========================================================
   BULLET UPDATE
========================================================= */

function updateBullets(
    dt
){

    for(
        const bullet of
        State.bullets
    ){

        if(
            bullet.dead
        ){

            continue;

        }

        const oldX =
            bullet.x;

        const oldY =
            bullet.y;

        bullet.x +=
            bullet.vx *
            dt;

        bullet.y +=
            bullet.vy *
            dt;

        bullet.life -=
            dt * 1000;

        /*
           wall collision
        */

        if(
            collidesWorld(
                bullet.x,
                bullet.y,
                CONFIG.BULLET_RADIUS
            )
        ){

            bullet.dead =
                true;

            createImpact(
                bullet.x,
                bullet.y,
                bullet.color
            );

            continue;

        }

        /*
           out of world
        */

        if(
            bullet.x < -50 ||
            bullet.x > MAP.width + 50 ||
            bullet.y < -50 ||
            bullet.y > MAP.height + 50
        ){

            bullet.dead = true;

            continue;

        }

        /*
           life
        */

        if(
            bullet.life <= 0
        ){

            bullet.dead = true;

            continue;

        }

        /*
           player collision
        */

        const players =
            Object.values(
                State.players
            );

        for(
            const p of players
        ){

            if(
                bullet.dead
                ||
                !p.alive
                ||
                p.id ===
                bullet.owner
            ){

                continue;

            }

            const dx =
                p.x -
                bullet.x;

            const dy =
                p.y -
                bullet.y;

            const distSq =
                dx*dx +
                dy*dy;

            const hitRadius =
                CONFIG.PLAYER_RADIUS +
                CONFIG.BULLET_RADIUS;

            if(
                distSq <
                hitRadius *
                hitRadius
            ){

                bullet.dead =
                    true;

                createImpact(
                    bullet.x,
                    bullet.y,
                    bullet.color
                );

                /*
                   فقط مطلق الرصاصة
                   هو المسؤول عن الضرر المحلي
                   حتى لا يتكرر الضرر في كل جهاز.
                */

                if(
                    bullet.owner ===
                    State.myId
                ){

                    applyDamage(
                        p,
                        bullet.owner
                    );

                }

            }

        }

    }

    State.bullets =
        State.bullets.filter(
            b=>!b.dead
        );

}

function applyDamage(
    target,
    attackerId
){

    if(
        !target ||
        !target.alive

    }

    target.hp -=

    NetworkController.send(
        'hit',
        {

            damage:

            attackerId:
                attackerId

        target.hp <= 0
    ){

        target.hp =
            0;

        killPlayer(
            target,
            attackerId
        );

    }

}

function applyRemoteHit(
    data
){

    const target =
        State.players[
            data.targetId
        ];

    if(

    ){

    /*
       على جهاز الهدف،
       لا نخفض الحياة هنا إذا كان
       الهدف هو لاعباً بعيداً عنا؟

       لأننا نحتاج عرض حالة الموت.
       السيرفر يجب أن يكون المرجع النهائي.
    */

    if(
        target.id ===
        State.myId
    ){

        /*
           الحماية من التكرار:
           إذا الضربة وصلت للهدف محلياً
           نطبقها.
        */

        target.hp -=
            Number(
                data.damage
            ) || 50;

        if(
            target.hp <= 0
        ){

            target.hp = 0;

            killPlayer(
                target,
                data.attackerId
            );

        }

    }

}

function killPlayer(
    player,
    killerId
){

    if(
        !player.alive
    ){

        return;

    }

    player.alive =
        false;

    player.hp =
        0;

    player.deaths =
        (player.deaths || 0) + 1;

    player.respawnAt =
        performance.now() +
        CONFIG.RESPAWN_TIME;

    createExplosion(
        player.x,
        player.y,
        player.color
    );

    if(
        killerId &&
        State.players[
            killerId
        ]
    ){

        State.players[
            killerId
        ].kills =
            (
                State.players[
                    killerId
                ].kills || 0
            ) + 1;

    }

    NetworkController.send(
        'death',
        {

            playerId:
                player.id,

            killerId:
                killerId || null,

            x:
                player.x,

            y:
                player.y

        }
    );

    updatePlayersUI();

    if(
        player.id ===
        State.myId
    ){

        flashMessage(
            'تم تدمير دبابـتك',
            'ستعود خلال لحظات...',
            1400

/* =========================================================
   RESPAWN
========================================================= */

function respawnLocal(){

    const me =
        State.players[
            State.myId
        ];

    if(
        !me ||
        me.alive
    ){

        return;

    }

    let count =
        Object.keys(
            State.players
        ).length;

    let alivePlayers =
        Object.values(
            State.players
        ).filter(
            p=>p.alive
        );

    let spawn =
        null;

    /*
       نختار سبون لا يوجد حوله لاعب.
    */

    const candidates =
        MAP.spawnPoints;

    for(
        let i=0;
        i<candidates.length;
        i++
    ){

        const c =
            candidates[i];

        let safe = true;

        for(
            const p of alivePlayers
        ){

            if(
                Utils.distance(
                    c,
                    p
                ) <
                280
            ){

                safe = false;
                break;

            }

        }

        if(safe){

            spawn = c;
            break;

        }

    }

    if(!spawn){

        spawn =
            candidates[
                Math.floor(
                    Math.random() *
                    candidates.length
                )
            ];

    }

    me.x =
        spawn.x;

    me.y =
        spawn.y;

    me.targetX =
        spawn.x;

    me.targetY =
        spawn.y;

    me.angle =
        spawn.angle;

    me.targetAngle =
        spawn.angle;

    me.hp =
        100;

    me.alive =
        true;

    me.respawnAt =
        0;

    document.getElementById(
        'respawnButton'
    ).classList.remove(
        'show'
    );

    createSpawnEffect(
        me.x,
        me.y,
        me.color
    );

    NetworkController.send(
        'respawn',
        buildNetworkPlayer()
    );

}

/* =========================================================
   LOCAL PLAYER UPDATE
========================================================= */

function updateLocalPlayer(
    dt
){

    const me =
        State.players[
            State.myId
        ];

    if(!me){
        return;
    }

    if(
        !me.alive
    ){

        if(
            performance.now() >=
            me.respawnAt
        ){

            respawnLocal();

        }

        return;

    }

    let ix =
        joystick.x;

    let iy =
        joystick.y;

    if(
        State.keyboard.up
    ){

        iy -= 1;

    }

    if(
        State.keyboard.down
    ){

        iy += 1;

    }

    if(
        State.keyboard.left
    ){

        ix -= 1;

    }

    if(
        State.keyboard.right
    ){

        ix += 1;

    }

    const length =
        Math.sqrt(
            ix*ix +
            iy*iy
        );

    if(
        length >
        1
    ){

        ix /= length;
        iy /= length;

    }

    me.inputX =
        ix;

    me.inputY =
        iy;

    /*
       اتجاه الدبابة مرتبط بالحركة.
    */

    if(
        length >
        .10
    ){

        me.angle =
            Math.atan2(
                iy,
                ix
            );

        me.targetAngle =
            me.angle;

        me.aimX =
            Math.cos(
                me.angle
            );

        me.aimY =
            Math.sin(
                me.angle
            );

    }

    /*
       حركة ثابتة وسلسة.
    */

    moveCircle(
        me,
        ix *
            CONFIG.PLAYER_SPEED *
            dt,

        iy *
            CONFIG.PLAYER_SPEED *
            dt,

        CONFIG.PLAYER_RADIUS
    );

    /*
       إذا النار مفعلة نستمر بالإطلاق.
    */

    if(shooting){

        shoot();

    }

    /*
       Camera smooth follow.
    */

    const targetZoom =
        Math.min(
            1.18,
            Math.max(
                .83,
                Math.min(
                    VIEW_W /
                    1000,
                    VIEW_H /
                    650
                )
            )
        );

    State.camera.zoom =
        Utils.lerp(
            State.camera.zoom,
            targetZoom,
            .06
        );

}

/* =========================================================
   REMOTE PLAYER UPDATE
========================================================= */

function updateRemotePlayers(
    dt
){

    for(
        const p of
        Object.values(
            State.players
        )
    ){

        if(
            p.isLocal
        ){

            continue;

        }

        const smoothing =
            1 -
            Math.pow(
                0.0001,
                dt
            );

        p.x =
            Utils.lerp(
                p.x,
                p.targetX,
                smoothing
            );

        p.y =
            Utils.lerp(
                p.y,
                p.targetY,
                smoothing
            );

        p.angle =
            Utils.lerpAngle(
                p.angle,
                p.targetAngle,
                Math.min(
                    1,
                    smoothing *
                    1.6
                )
            );

    }

}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const me =
        State.players[
            State.myId
        ];

    if(!me){
        return;
    }

    const zoom =
        State.camera.zoom;

    const targetX =
        me.x -
        VIEW_W /
        2 /
        zoom;

    const targetY =
        me.y -
        VIEW_H /
        2 /
        zoom;

    /*
       نسمح للكاميرا أن تقترب من حدود الخريطة
       بدون ظهور فراغات.
    */

    const maxX =
        MAP.width -
        VIEW_W /
        zoom;

    const maxY =
        MAP.height -
        VIEW_H /
        zoom;

    const desiredX =
        Utils.clamp(
            targetX,
            0,
            Math.max(
                0,
                maxX
            )
        );

    const desiredY =
        Utils.clamp(
            targetY,
            0,
            Math.max(
                0,
                maxY
            )
        );

    State.camera.x =
        Utils.lerp(
            State.camera.x,
            desiredX,
            .12
        );

    State.camera.y =
        Utils.lerp(
            State.camera.y,
            desiredY,
            .12
        );

}

/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    const zoom =
        State.camera.zoom;

    ctx.save();

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -State.camera.x,
        -State.camera.y
    );

    /*
       أرضية
    */

    drawFloor();

    /*
       Decorative grid
    */

    drawGrid();

    /*
       walls
    */

    drawWalls();

    /*
       spawn markers faint
    */

    drawSpawnZones();

    /*
       bullets
    */

    drawBullets();

    /*
       tanks
    */

    drawPlayers();

    /*
       particles
    */

    drawParticles();

    drawExplosions();

    ctx.restore();

}

/* =========================================================
   FLOOR
========================================================= */

function drawFloor(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            MAP.height
        );

    gradient.addColorStop(
        0,
        '#39464d'
    );

    gradient.addColorStop(
        .48,
        '#303b42'
    );

    gradient.addColorStop(
        1,
        '#253037'
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        MAP.width,
        MAP.height
    );

    /*
       subtle noise-like squares
    */

    const cell =
        80;

    ctx.globalAlpha =
        .055;

    ctx.strokeStyle =
        '#d7e2e7';

    ctx.lineWidth =
        1;

    for(
        let x=TILE_START;
        x<MAP.width;
        x+=cell
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            MAP.height
        );

        ctx.stroke();

    }

    for(
        let y=TILE_START;
        y<MAP.height;
        y+=cell
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            MAP.width,
            y
        );

        ctx.stroke();

    }

    ctx.globalAlpha =
        1;

}

const TILE_START =
    0;

/* =========================================================
   GRID
========================================================= */

function drawGrid(){

    const cell =
        120;

    ctx.globalAlpha =
        .06;

    ctx.strokeStyle =
        '#ffffff';

    ctx.lineWidth =
        2;

    for(
        let x=0;
        x<=MAP.width;
        x+=cell
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            MAP.height
        );

        ctx.stroke();

    }

    for(
        let y=0;
        y<=MAP.height;
        y+=cell
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            MAP.width,
            y
        );

        ctx.stroke();

    }

    ctx.globalAlpha =
        1;

}

/* =========================================================
   WALLS
========================================================= */

function drawWalls(){

    for(
        const wall of MAP.walls
    ){

        /*
           shadow
        */

        ctx.fillStyle =
            'rgba(0,0,0,.25)';

        ctx.fillRect(
            wall.x + 8,
            wall.y + 8,
            wall.w,
            wall.h
        );

        /*
           main wall
        */

        const grad =
            ctx.createLinearGradient(
                wall.x,
                wall.y,
                wall.x,
                wall.y + wall.h
            );

        grad.addColorStop(
            0,
            '#68737a'
        );

        grad.addColorStop(
            .45,
            '#505a60'
        );

        grad.addColorStop(
            1,
            '#394349'
        );

        ctx.fillStyle =
            grad;

        roundRect(
            ctx,
            wall.x,
            wall.y,
            wall.w,
            wall.h,
            9
        );

        ctx.fill();

        /*
           top highlight
        */

        ctx.strokeStyle =
            'rgba(255,255,255,.10)';

        ctx.lineWidth =
            2;

        ctx.beginPath();

        ctx.moveTo(
            wall.x + 7,
            wall.y + 2
        );

        ctx.lineTo(
            wall.x +
            wall.w -
            7,
            wall.y + 2
        );

        ctx.stroke();

    }

}

/* =========================================================
   TANK
========================================================= */

function drawTank(
    p
){

    const x =
        p.x;

    const y =
        p.y;

    const angle =
        p.angle;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    /*
       death/selection ring
    */

    if(
        p.id ===
        State.myId
    ){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            39,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            'rgba(255,255,255,.18)';

        ctx.lineWidth =
            2;

        ctx.stroke();

    }

    ctx.rotate(
        angle
    );

    /*
       tank shadow
    */

    ctx.fillStyle =
        'rgba(0,0,0,.38)';

    roundRect(
        ctx,
        -34,
        -22 + 7,
        68,
        44,
        10
    );

    ctx.fill();

    /*
       tracks
    */

    ctx.fillStyle =
        '#1a2024';

    roundRect(
        ctx,
        -32,
        -25,
        64,
        15,
        6
    );

    ctx.fill();

    roundRect(
        ctx,
        -32,
        10,
        64,
        15,
        6
    );

    ctx.fill();

    /*
       track highlights
    */

    ctx.strokeStyle =
        'rgba(255,255,255,.10)';

    ctx.lineWidth =
        2;

    for(
        let i=-23;
        i<=23;
        i+=11
    ){

        ctx.beginPath();

        ctx.moveTo(
            i,
            -21
        );

        ctx.lineTo(
            i,
            -14
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            i,
            14
        );

        ctx.lineTo(
            i,
            21
        );

        ctx.stroke();

    }

    /*
       body
    */

    const bodyGrad =
        ctx.createLinearGradient(
            -20,
            -17,
            22,
            18
        );

    bodyGrad.addColorStop(
        0,
        lighten(
            p.color,
            .22
        )
    );

    bodyGrad.addColorStop(
        .45,
        p.color
    );

    bodyGrad.addColorStop(
        1,
        darken(
            p.color,
            .26
        )
    );

    ctx.fillStyle =
        bodyGrad;

    roundRect(
        ctx,
        -23,
        -17,
        46,
        34,
        9
    );

    ctx.fill();

    /*
       cannon
    */

    ctx.fillStyle =
        '#20272c';

    roundRect(
        ctx,
        3,
        -7,
        37,
        14,
        5
    );

    ctx.fill();

    ctx.fillStyle =
        '#303940';

    roundRect(
        ctx,
        28,
        -6,
        16,
        12,
        3
    );

    ctx.fill();

    /*
       turret
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        15,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        darken(
            p.color,
            .12
        );

    ctx.fill();

    ctx.strokeStyle =
        'rgba(255,255,255,.20)';

    ctx.lineWidth =
        2;

    ctx.stroke();

    /*
       commander hatch
    */

    ctx.beginPath();

    ctx.arc(
        -1,
        -2,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        'rgba(255,255,255,.17)';

    ctx.fill();

    /*
       my marker
    */

    if(
        p.id ===
        State.myId
    ){

        ctx.strokeStyle =
            'rgba(255,255,255,.62)';

        ctx.lineWidth =
            2;

        roundRect(
            ctx,
            -28,
            -31,
            56,
            62,
            12
        );

        ctx.stroke();

    }

    ctx.restore();

    /*
       name + health bar in world coordinates
    */

    drawPlayerLabel(
        p
    );

}

/* =========================================================
   BULLETS
========================================================= */

function drawBullets(){

    for(
        const b of State.bullets
    ){

        if(
            b.dead
        ){

            continue;

        }

        ctx.save();

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            b.color;

        ctx.fillStyle =
            '#fff';

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            b.color;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

        /*
           tracer
        */

        const mag =
            Math.sqrt(
                b.vx*b.vx +
                b.vy*b.vy
            );

        if(
            mag > 0
        ){

            ctx.globalAlpha =
                .35;

            ctx.strokeStyle =
                b.color;

            ctx.lineWidth =
                3;

            ctx.beginPath();

            ctx.moveTo(
                b.x,
                b.y
            );

            ctx.lineTo(
                b.x -
                b.vx / mag * 18,

                b.y -
                b.vy / mag * 18
            );

            ctx.stroke();

            ctx.globalAlpha =
                1;

        }

    }

}

/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(
    dt
){

    for(
        const p of State.particles
    ){

        p.x +=
            p.vx *
            dt;

        p.y +=
            p.vy *
            dt;

        p.vx *=
            Math.pow(
                .05,
                dt
            );

        p.vy *=
            Math.pow(
                .05,
                dt
            );

        p.life -=
            dt;

    }

    State.particles =
        State.particles.filter(
            p=>p.life > 0
        );

    for(
        const e of State.explosions
    ){

        e.time +=
            dt;

    }

    State.explosions =
        State.explosions.filter(
            e=>
                e.time <
                e.duration
        );

}

/* =========================================================
   PARTICLE DRAW
========================================================= */

function drawParticles(){

    for(
        const p of State.particles
    ){

        const alpha =
            Utils.clamp(
                p.life /
                p.maxLife,
                0,
                1
            );

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size * alpha,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha =
        1;

}

/* =========================================================
   EXPLOSIONS
========================================================= */

function drawExplosions(){

    for(
        const e of
        State.explosions
    ){

        const t =
            e.time /
            e.duration;

        const radius =
            Utils.lerp(
                8,
                82,
                Math.min(
                    1,
                    t
                )
            );

        const alpha =
            1 -
            t;

        ctx.save();

        ctx.globalAlpha =
            alpha;

        const glow =
            ctx.createRadialGradient(
                e.x,
                e.y,
                0,
                e.x,
                e.y,
                radius
            );

        glow.addColorStop(
            0,
            'rgba(255,255,255,.95)'
        );

        glow.addColorStop(
            .17,
            'rgba(255,215,74,.95)'
        );

        glow.addColorStop(
            .52,
            'rgba(255,90,30,.58)'
        );

        glow.addColorStop(
            1,
            'rgba(255,30,0,0)'
        );

        ctx.fillStyle =
            glow;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}

/* =========================================================
   MINIMAP

function drawMiniMap(){

    const h = 82;

    miniCtx.clearRect(
        0,
        0,
        w,
        h

    miniCtx.fillStyle =
        '#1a2329';

    miniCtx.fillRect(
        0,

        w,

    */

    const sx =

    const sy =

    */

            p.x * sx,

/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    if(
        !State.matchStarted
    ){

        return;

    }

    const remaining =
        (
            State.matchEndAt -
            performance.now()
        ) /
        1000;

    if(
        remaining <= 0
    ){

        endMatch();

        return;

    }

    document.getElementById(
        'timer'
    ).textContent =
        Utils.formatTime(
            remaining
        );

}

/* =========================================================
   END MATCH
========================================================= */

function endMatch(){

    State.matchStarted =
        false;

    const players =
        Object.values(
            State.players
        );

    players.sort(
        (a,b)=>
            (b.kills || 0) -
            (a.kills || 0)
    );

    const winner =
        players[0];

    flashMessage(
        'انتهت الجولة',
        winner
            ? 'الفائز: ' +
              winner.name +
              ' — قتلات: ' +
              (winner.kills || 0)
            : 'جولة جديدة قادمة',
        5000
    );

}

/* =========================================================
   COLORS
========================================================= */

function lighten(
    hex,
    amount
){

    const c =
        hexToRgb(
            hex
        );

    const r =
        Math.round(
            c.r +
            (255-c.r)*amount
        );

    const g =
        Math.round(
            c.g +
            (255-c.g)*amount
        );

    const b =
        Math.round(
            c.b +
            (255-c.b)*amount
        );

    return rgb(
        r,g,b
    );

}

function darken(
    hex,
    amount
){

    const c =
        hexToRgb(
            hex
        );

    return rgb(
        Math.round(
            c.r*(1-amount)
        ),

        Math.round(
            c.g*(1-amount)
        ),

        Math.round(
            c.b*(1-amount)
        )
    );

}

function hexToRgb(
    hex
){

    const h =
        hex.replace(
            '#',
            ''
        );

    return {

        r:
            parseInt(
                h.substring(0,2),
                16
            ),

        g:
            parseInt(
                h.substring(2,4),
                16
            ),

        b:
            parseInt(
                h.substring(4,6),
                16
            )

    };

}

function rgb(
    r,
    g,
    b
){

    return `rgb(${r},${g},${b})`;

}

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
){

    radius =
        Math.min(
            radius,
            width/2,
            height/2
        );

    context.beginPath();

    context.moveTo(
        x + radius,
        y
    );

    context.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
    );

    context.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
    );

    context.arcTo(
        x,
        y + height,
        x,
        y,
        radius
    );

    context.arcTo(
        x,
        y,
        x + width,
        y,
        radius
    );

    context.closePath();

}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
    time
){

    if(
        !State.lastFrame
    ){

        State.lastFrame =
            time;

    }

    let dt =
        (
            time -
            State.lastFrame
        )
        /
        1000;

    State.lastFrame =
        time;

    /*
       لا نخلي lag يعمل قفزة ضخمة.
    */

    dt =
        Math.min(
            dt,
            .033
        );

    if(
        State.running
    ){

        updateLocalPlayer(
            dt
        );

        updateRemotePlayers(
            dt
        );

        updateBullets(
            dt
        );

        updateParticles(
            dt
        );

        networkUpdate(
            dt
        );

        updateCamera();

        updateTimer();

    }else{

        /*
           حتى شاشة الانتظار تظل الرسوميات شغالة.
        */

        updateParticles(
            dt
        );

    }

    /*
       render
    */

    ctx.clearRect(
        0,
        0,
        VIEW_W,
        VIEW_H
    );

    /*
       لون خلفية في حال حجم الكاميرا
    */

    ctx.fillStyle =
        '#11181d';

    ctx.fillRect(
        0,
        0,
        VIEW_W,
        VIEW_H
    );

    drawWorld();

    drawMiniMap();

    requestAnimationFrame(
        gameLoop
    );

}

/* =========================================================
   START NETWORK + LOOP
========================================================= */

NetworkController.init();

requestAnimationFrame(
    gameLoop
);

/* =========================================================
   INITIAL CONNECTION STATUS
========================================================= */

setConnectionStatus(
    false,
    'جاري فحص الاتصال...'
);
