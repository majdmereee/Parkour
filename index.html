<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوكي نيون أونلاين - 5 لاعبين 🏑</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; }
        .container { background: #1e1e24; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,204,0.1); text-align: center; width: 90%; max-width: 450px; z-index: 10; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); margin-bottom: 5px; }
        .input-group { display: flex; gap: 10px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border: 2px solid #555; background: #121212; color: #fff; border-radius: 8px; text-align: center; outline: none;}
        input:focus { border-color: #00ffcc; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; color:#000; width: 100%; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; margin-top: 10px;}
        button:hover { filter: brightness(1.2); }
        button:disabled { background: #555; box-shadow: none; cursor: not-allowed; }
        
        #gameArea { display: none; flex-direction: column; align-items: center; width: 100%; }
        #topBar { display: flex; justify-content: space-between; width: 100%; max-width: 600px; padding: 10px; box-sizing: border-box; align-items: center;}
        #status { font-size: 1.1em; font-weight: bold; color: #ffcc00; }
        #startBtn { display: none; width: auto; padding: 8px 15px; margin: 0; font-size: 14px;}
        canvas { background: #1a1a24; border: 3px solid #333; border-radius: 50%; box-shadow: inset 0 0 30px #000, 0 0 20px rgba(0, 255, 204, 0.2); max-width: 95vw; max-height: 80vh; object-fit: contain; }
    </style>
</head>
<body>

    <div class="container" id="loginArea">
        <h1>هوكي نيون 🏑</h1>
        <p style="color: #aaa; font-size: 14px;">تحدي حتى 5 لاعبين - البقاء للأقوى</p>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="اسمك..." required>
            <input type="number" id="roomCode" placeholder="رقم الغرفة" required>
        </div>
        <button onclick="joinGame()">دخول الغرفة</button>
    </div>

    <div id="gameArea">
        <div id="topBar">
            <div id="status">جاري الاتصال...</div>
            <button id="startBtn" onclick="requestStart()">بدء اللعبة</button>
        </div>
        <canvas id="hockeyBoard" width="600" height="600"></canvas>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const SERVER_URL = 'https://render-kr1o.onrender.com/';
        let socket;
        let myRoom = "", myName = "", myId = "";
        let isHost = false;
        let isPlaying = false;
        
        const canvas = document.getElementById('hockeyBoard');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const R = 280; // نصف قطر الحلبة

        // ألوان النيون لكل لاعب
        const colors = ['#00ffcc', '#ff0055', '#ffcc00', '#00ccff', '#cc00ff'];
        
        let players = {}; 
        let activePlayerIds = [];
        let puck = { x: cx, y: cy, r: 12, dx: 0, dy: 0 };

        function joinGame() {
            myName = document.getElementById('playerName').value.trim();
            myRoom = document.getElementById('roomCode').value.trim();
            if (!myName || !myRoom) return alert("الرجاء كتابة اسمك ورقم الغرفة!");

            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';

            socket = io(SERVER_URL, { transports: ['websocket'], upgrade: false });
            
            socket.on('connect', () => { 
                myId = socket.id;
                document.getElementById('status').innerText = `متصل! بانتظار اللاعبين...`; 
                socket.emit('playerMoved', { type: 'join', room: myRoom, id: myId, name: myName });
            });

            socket.on('otherPlayerMoved', (data) => {
                if (data.room !== myRoom) return;

                if (data.type === 'join') {
                    if (Object.keys(players).length === 0 && data.id === myId) {
                        isHost = true; // أول شخص بالغرفة هو الهوست
                        document.getElementById('startBtn').style.display = 'block';
                    }
                    if (isHost && Object.keys(players).length < 5 && !isPlaying) {
                        players[data.id] = { id: data.id, name: data.name, lives: 5, x: cx, y: cy, color: colors[Object.keys(players).length] };
                        activePlayerIds.push(data.id);
                        broadcastState(); // الهوست ينشر القائمة للمنضمين
                    }
                } 
                else if (data.type === 'state_sync') {
                    players = data.players;
                    activePlayerIds = data.active;
                    isPlaying = data.isPlaying;
                    if(!isHost) {
                        puck.x = data.px; puck.y = data.py;
                    }
                    updateStatus();
                }
                else if (data.type === 'paddle_update' && isHost) {
                    if (players[data.id]) {
                        players[data.id].x = data.x;
                        players[data.id].y = data.y;
                    }
                }
            });

            setInterval(gameLoop, 1000 / 60);
        }

        function requestStart() {
            if (activePlayerIds.length < 2) return alert("تحتاج إلى لاعبين على الأقل للبدء!");
            isPlaying = true;
            document.getElementById('startBtn').style.display = 'none';
            // رمي الطابة بشكل عشوائي
            let angle = Math.random() * Math.PI * 2;
            puck.dx = Math.cos(angle) * 5;
            puck.dy = Math.sin(angle) * 5;
            broadcastState();
        }

        function broadcastState() {
            if (!isHost) return;
            socket.emit('playerMoved', { 
                type: 'state_sync', room: myRoom, players, active: activePlayerIds, isPlaying, px: puck.x, py: puck.y 
            });
        }

        // حركة اللاعب
        function movePaddle(clientX, clientY) {
            if (!isPlaying || !players[myId] || players[myId].lives <= 0) return;
            const rect = canvas.getBoundingClientRect();
            let mx = (clientX - rect.left) * (canvas.width / rect.width);
            let my = (clientY - rect.top) * (canvas.height / rect.height);

            // منع اللاعب من تجاوز المنتصف أو الخروج من الدائرة
            let dx = mx - cx, dy = my - cy;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > R - 20) {
                mx = cx + (dx/dist) * (R - 20);
                my = cy + (dy/dist) * (R - 20);
            }

            players[myId].x = mx; players[myId].y = my;
            socket.emit('playerMoved', { type: 'paddle_update', room: myRoom, id: myId, x: mx, y: my });
        }

        canvas.addEventListener('mousemove', (e) => movePaddle(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); movePaddle(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        function gameLoop() {
            if (isHost && isPlaying) {
                updatePhysics();
                broadcastState(); // الهوست ينشر التحديثات باستمرار
            }
            draw();
        }

        function updatePhysics() {
            let n = activePlayerIds.length;
            if (n <= 1) {
                isPlaying = false;
                document.getElementById('status').innerText = `🏆 الفائز هو: ${players[activePlayerIds[0]].name}`;
                return;
            }

            puck.x += puck.dx; puck.y += puck.dy;

            // احتكاك الهواء
            puck.dx *= 0.998; puck.dy *= 0.998;

            // التحقق من اصطدام الطابة بحواف الدائرة (أقسام اللاعبين)
            let dx = puck.x - cx;
            let dy = puck.y - cy;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist + puck.r >= R) {
                // تحديد زاوية الطابة لمعرفة في منطقة أي لاعب سقطت
                let angle = Math.atan2(dy, dx);
                if (angle < 0) angle += Math.PI * 2;
                
                let sliceAngle = (Math.PI * 2) / n;
                let playerIndex = Math.floor(angle / sliceAngle);
                let hitPlayerId = activePlayerIds[playerIndex];

                // خسارة حياة
                players[hitPlayerId].lives--;
                
                if (players[hitPlayerId].lives <= 0) {
                    activePlayerIds.splice(playerIndex, 1); // إزالة اللاعب
                }

                // إعادة الطابة للمنتصف
                puck.x = cx; puck.y = cy;
                let newAngle = Math.random() * Math.PI * 2;
                puck.dx = Math.cos(newAngle) * 5;
                puck.dy = Math.sin(newAngle) * 5;
            }

            // تصادم الطابة مع المضارب
            activePlayerIds.forEach(id => {
                let p = players[id];
                let pdx = puck.x - p.x, pdy = puck.y - p.y;
                let pdist = Math.sqrt(pdx*pdx + pdy*pdy);
                if (pdist < puck.r + 25) { // 25 هو نصف قطر المضرب
                    let hitAngle = Math.atan2(pdy, pdx);
                    let speed = Math.sqrt(puck.dx*puck.dx + puck.dy*puck.dy) + 2;
                    if (speed > 12) speed = 12;
                    puck.dx = Math.cos(hitAngle) * speed;
                    puck.dy = Math.sin(hitAngle) * speed;
                    puck.x = p.x + Math.cos(hitAngle) * (puck.r + 26);
                    puck.y = p.y + Math.sin(hitAngle) * (puck.r + 26);
                }
            });
        }

        function updateStatus() {
            let n = activePlayerIds.length;
            if(!isPlaying && n > 1 && !isHost) {
                document.getElementById('status').innerText = `في انتظار قيام المضيف ببدء اللعبة... (${n} لاعبين)`;
            } else if (isPlaying) {
                let pInfo = players[myId];
                if (pInfo && pInfo.lives > 0) {
                    document.getElementById('status').innerText = `أرواحك: ${'❤️'.repeat(pInfo.lives)}`;
                } else {
                    document.getElementById('status').innerText = `لقد خسرت 💀 (أنت الآن تشاهد)`;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let n = activePlayerIds.length;

            if (n > 0) {
                let sliceAngle = (Math.PI * 2) / n;
                
                // رسم خطوط التقسيم للحلبة
                for (let i = 0; i < n; i++) {
                    let angle = i * sliceAngle;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + Math.cos(angle) * R, cy + Math.sin(angle) * R);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // رسم حواف الأهداف (أقواس) بألوان اللاعبين
                    let id = activePlayerIds[i];
                    ctx.beginPath();
                    ctx.arc(cx, cy, R, angle, angle + sliceAngle);
                    ctx.strokeStyle = players[id].color;
                    ctx.lineWidth = 6;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = players[id].color;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            } else {
                ctx.beginPath();
                ctx.arc(cx, cy, R, 0, Math.PI * 2);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // رسم المضارب
            Object.values(players).forEach(p => {
                if (p.lives > 0) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    
                    // اسم اللاعب وعدد أرواحه
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff";
                    ctx.font = "14px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(`${p.name} (${p.lives})`, p.x, p.y - 35);
                }
            });

            // رسم الطابة
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>
